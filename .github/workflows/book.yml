name: book
on:
  push:
    paths: ["book/**", "docs/**", ".github/workflows/book.yml"]
  pull_request:
    paths: ["book/**", "docs/**", ".github/workflows/book.yml"]
  # Deploying to GitHub Pages is manual: on this plan a Pages site is public to anyone with the URL.
  # For a private copy, use book/deploy-cloudflare.sh (see book/DEPLOY.md).
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: mdBook 0.5.4 (digest-pinned)
        run: |
          curl -sSfL -o mdbook.tgz https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz
          echo "3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7  mdbook.tgz" | sha256sum -c
          tar -xzf mdbook.tgz
      - run: ./mdbook build book
      - uses: actions/upload-pages-artifact@v5
        with:
          path: book/book
  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
