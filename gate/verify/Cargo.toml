[package]
name = "pge-verify"
version.workspace = true
edition.workspace = true

[dependencies]
pge-wire = { path = "../wire" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
libc.workspace = true
num-bigint.workspace = true
num-traits.workspace = true
ezkl = { path = "../../.deps/ezkl", default-features = false }
halo2_proofs = { path = "../../.deps/halo2/halo2_proofs", features = ["circuit-params", "mv-lookup"] }
halo2curves = { path = "../../.deps/halo2curves", features = ["derive_serde"] }
snark-verifier = { path = "../../.deps/snark-verifier/snark-verifier", features = ["derive_serde", "mv-lookup"] }

