# Only the endpoint's port in, only its link to the AI server out; everything else is dropped.
# IPv6 is not loaded on the image, so only IPv4 needs rules.
flush ruleset
table ip pge {
	chain input {
		type filter hook input priority 0; policy drop;
		iif "lo" accept
		ct state established,related accept
		ip saddr 192.168.2.0/24 tcp dport 8700 ct state new accept
	}
	chain output {
		type filter hook output priority 0; policy drop;
		oif "lo" accept
		ct state established,related accept
		ip daddr 192.168.2.1 tcp dport 8701 ct state new accept
	}
	chain forward {
		type filter hook forward priority 0; policy drop;
	}
}
